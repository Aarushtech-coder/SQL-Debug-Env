[project]
name = "sql-debug-env"
version = "1.0.0"
description = "OpenEnv environment for training AI agents to debug SQL queries"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "openenv-core>=0.2.0",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "streamlit>=1.33.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "sqlglot>=23.0.0",
    "Faker>=25.0.0",
    "gymnasium>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.openenv]
name = "sql-debug-env"
version = "1.0.0"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = "debugenv"
extraPaths = ["."]
executionEnvironments = [
    { root = ".", extraPaths = ["."] }
]
